{% if page.meta.mastodon_id %}
<section class="md-typeset">
  <hr />
  <h2>Komentarze z Fediverse</h2>
  <p>
    Dyskusja do tego artykułu toczy się na Mastodonie. Aby wziąć w niej udział, odpowiedz na 
    <a href="https://infosec.exchange/@{{ page.meta.mastodon_user | default('eteryu') }}/{{ page.meta.mastodon_id }}" target="_blank" rel="noopener">ten wpis</a>.
  </p>

  <!-- Poprawny atrybut dla dpecos/mastodon-comments to toot-id -->
  <mastodon-comments 
    host="infosec.exchange" 
    user="{{ page.meta.mastodon_user | default('eteryu') }}" 
    toot-id="{{ page.meta.mastodon_id }}">
  </mastodon-comments>

  <script src="https://cdn.jsdelivr.net/gh/dpecos/mastodon-comments@latest/mastodon-comments.js" async></script>
</section>
{% endif %}
